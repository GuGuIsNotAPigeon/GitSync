name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - run: npm ci
    - run: npm run tauri build -- --ci
    - name: Package tar.gz (Linux)
      run: |
        VERSION=$(node -p "require('./package.json').version")
        cd src-tauri/target/release
        tar -czf "bundle/GitSync-${VERSION}-linux-$(uname -m).tar.gz" GitSync
    - name: Build Arch Linux package
      run: |
        VERSION=$(node -p "require('./package.json').version")
        cp src-tauri/target/release/GitSync aur/
        sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
        docker run --rm -v "$PWD/aur:/pkg" -w /pkg archlinux:latest bash -c "
          pacman -Syu --noconfirm base-devel
          useradd -m builder
          chown -R builder:builder /pkg
          su builder -c 'makepkg -fd --noconfirm'
        "
        mkdir -p src-tauri/target/release/bundle/arch
        cp aur/gitsync-*.pkg.tar.zst src-tauri/target/release/bundle/arch/
    - name: Collect installers
      id: files
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
        list=$(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.pkg.tar.zst' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.pkg' \) -exec basename {} \; | sort -u)
        json=$(echo "$list" | $PY -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-ubuntu
        path: |
          src-tauri/target/release/bundle/deb/*
          src-tauri/target/release/bundle/rpm/*
          src-tauri/target/release/bundle/arch/*
          src-tauri/target/release/bundle/*.tar.gz
        if-no-files-found: error

  publish-ubuntu:
    needs: build-ubuntu
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-ubuntu.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-ubuntu
        path: out
    - name: Move installer
      run: find out -type f -name "${{ matrix.file }}" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - run: npm ci
    - run: npm run tauri build -- --ci
    - name: Collect installers
      id: files
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
        list=$(find src-tauri/target/release/bundle -type f -exec basename {} \;)
        json=$(echo "$list" | $PY -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-windows
        path: |
          src-tauri/target/release/bundle/msi/*
          src-tauri/target/release/bundle/nsis/*
        if-no-files-found: error

  publish-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-windows.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-windows
        path: out
    - name: Move installer
      run: find out -type f -name "${{ matrix.file }}" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - run: npm ci
    - name: Build Tauri app (macOS)
      run: |
        set -euo pipefail
        if [ -n "${APPLE_CERTIFICATE:-}" ]; then
          export APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            export APPLE_SIGNING_IDENTITY
          else
            unset APPLE_SIGNING_IDENTITY
          fi
        else
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
        fi
        npm run tauri build -- --ci --bundles app
    - name: Build dmg
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(node -p "require('./package.json').version")
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi
        cd src-tauri/target/release/bundle/macos
        STAGING=$(mktemp -d)
        ditto GitSync.app "$STAGING/GitSync.app"
        ln -s /Applications "$STAGING/Applications"
        mkdir -p ../dmg
        hdiutil create -volname GitSync -srcfolder "$STAGING" -ov -format UDZO -imagekey zlib-level=9 "../dmg/GitSync_${VERSION}_${ARCH}.dmg"
        rm -rf "$STAGING"
    - name: Notarize and staple dmg (macOS)
      if: env.APPLE_CERTIFICATE != ''
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        set -euo pipefail
        VERSION=$(node -p "require('./package.json').version")
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi
        DMG="src-tauri/target/release/bundle/dmg/GitSync_${VERSION}_${ARCH}.dmg"
        test -f "$DMG"
        test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"
        xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
        xcrun stapler staple "$DMG"
    - name: Collect installers
      id: files
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
        list=$(find src-tauri/target/release/bundle -type f -name '*.dmg' -exec basename {} \; | sort -u)
        json=$(echo "$list" | $PY -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
        echo "files=$json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bundle-macos
        path: |
          src-tauri/target/release/bundle/dmg/*
          src-tauri/target/release/bundle/macos/*
        if-no-files-found: error

  publish-macos:
    needs: build-macos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.build-macos.outputs.files) }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bundle-macos
        path: out
    - name: Move installer
      run: find out -type f -name "${{ matrix.file }}" -exec mv -n {} ./ \;
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file }}
        path: ${{ matrix.file }}
        if-no-files-found: error
