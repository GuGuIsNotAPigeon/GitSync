name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (non-macOS)
        if: matrix.os != 'macos-latest'
        run: npm run tauri build -- --ci --target ${{ matrix.target }}

      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: bash scripts/package-macos-dmg.sh ${{ matrix.target }}

      - name: Package tar.gz (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/${{ matrix.target }}/release
          tar -czf "bundle/GitSync-${VERSION}-linux-x86_64.tar.gz" GitSync

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-bundle
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*
            src-tauri/target/${{ matrix.target }}/release/bundle/*.tar.gz
          if-no-files-found: warn
