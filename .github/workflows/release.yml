name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (non-macOS)
        if: matrix.os != 'macos-latest'
        run: npm run tauri build -- --ci --target ${{ matrix.target }}

      - name: Build Tauri app (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run tauri build -- --ci --bundles app --target ${{ matrix.target }}

      - name: Build dmg (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          STAGING=$(mktemp -d)
          ditto GitSync.app "$STAGING/GitSync.app"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p ../dmg
          hdiutil create -volname GitSync -srcfolder "$STAGING" -ov -format UDZO -imagekey zlib-level=9 "../dmg/GitSync_${VERSION}_${ARCH}.dmg"
          rm -rf "$STAGING"

      - name: Package tar.gz (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/${{ matrix.target }}/release
          tar -czf "bundle/GitSync-${VERSION}-linux-x86_64.tar.gz" GitSync

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-bundle
          path: src-tauri/target/${{ matrix.target }}/release/bundle/*
